<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>teste Progress Bar</title>
</head>
<body>
<div class="container py-5">
    <div class="card-custom">

        <div class="row align-items-center mb-4 g-3">
            <div class="col-auto">
                <img src="logo.png" class="logo" alt="">
            </div>

            <div class="col">
                <h5 class="titulo">Treino personalizado</h5>

                <div class="barra">
                    <div class="progresso" style="width:85%;"></div>
                </div>
            </div>

            <div class="col-auto">
                <span class="percentual">85%</span>
            </div>
        </div>


        <div class="row align-items-center mb-4 g-3">
            <div class="col-auto">
                <div style="width:55px"></div>
            </div>

            <div class="col">
                <h5 class="titulo">Acompanhamento nutricional</h5>

                <div class="barra">
                    <div class="progresso" style="width:30%;"></div>
                </div>
            </div>

            <div class="col-auto">
                <span class="percentual">30%</span>
            </div>
        </div>


        <div class="row align-items-center g-3">
            <div class="col-auto">
                <div style="width:55px"></div>
            </div>

            <div class="col">
                <h5 class="titulo">Exercícios fisioterápicos</h5>

                <div class="barra">
                    <div class="progresso" style="width:70%;"></div>
                </div>
            </div>

            <div class="col-auto">
                <span class="percentual">70%</span>
            </div>
        </div>

    </div>
</div>


<style>
    body{
    background:#ececec;
}

.card-custom{
    background:#252d40;
    padding:35px;
    border-radius:8px;
}

.logo{
    width:55px;
}

.titulo{
    color:#fff;
    font-size:1.4rem;
    margin-bottom:15px;
    font-weight:600;
}

.percentual{
    color:#ff3b3b;
    font-size:1.4rem;
    font-weight:700;
}

.barra{
    width:100%;
    height:8px;
    background:#5a6170;
    border-radius:20px;
    overflow:hidden;
}

.progresso{
    height:100%;
    background:#e53935;
    border-radius:20px;
}


</style>
</body>
</html>
